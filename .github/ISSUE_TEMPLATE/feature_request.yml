name: Feature idea
description: Suggest something new or better
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What would it help you do?
      description: Describe the problem or the moment in your reading where you missed it.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Your idea
      description: How could it work? Sketches and examples from other apps are welcome.
    validations:
      required: true
