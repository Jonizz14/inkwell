name: Bug report
description: Something doesn't work as it should
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you see, and what did you expect instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open …
        2. Press …
        3. See …
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Inkwell version
      description: From the name of the installer you downloaded (Releases), or the commit if you built it yourself
      placeholder: 1.1.11
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options: [macOS, Windows]
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: Screenshots, PDF or logs
      description: A screenshot or a short recording helps a lot. If a PDF imports badly, attach it only if you're allowed to share it.
