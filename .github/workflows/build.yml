name: build
# Every push to main builds macOS and Windows and publishes them as a new release
# (v1.1.<run number>); pull requests only build, to check.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
env:
  VERSION: 1.1.${{ github.run_number }}
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      # the installers carry this build's version in their names and "About"
      - run: npm version ${{ env.VERSION }} --no-git-tag-version --allow-same-version
      # macOS: the native helpers (Vision OCR, read-along); Windows uses tesseract.js instead
      - if: matrix.os == 'macos-latest'
        run: npm run build:mac-tools
      - run: npx electron-builder ${{ matrix.os == 'macos-latest' && '--mac' || '--win' }} --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: inkwell-${{ matrix.os }}
          path: |
            dist/*.dmg
            dist/*.exe

  release:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: Inkwell ${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          body: |
            ${{ github.event.head_commit.message }}

            **macOS:** `Inkwell-${{ env.VERSION }}-arm64.dmg` · **Windows:** `Inkwell Setup ${{ env.VERSION }}.exe`
            Not code-signed: on Windows choose *More info → Run anyway*; on macOS right-click → *Open*.
          files: out/*
