name: build
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      # macOS: the native helpers (Vision OCR, read-along); Windows uses tesseract.js instead
      - if: matrix.os == 'macos-latest'
        run: npm run build:mac-tools
      - run: npx electron-builder ${{ matrix.os == 'macos-latest' && '--mac' || '--win' }} --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: 365-articles-${{ matrix.os }}
          path: |
            dist/*.dmg
            dist/*.exe
      # a version tag (v1.2.0) puts the installers on the GitHub release
      - if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.dmg
            dist/*.exe
