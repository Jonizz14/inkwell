name: build
# Every push to main builds macOS and Windows and publishes them as a new release
# (v1.1.<run number>); pull requests only build, to check. A push that only touches the web
# version (or the docs) makes no release: the installed apps would announce an empty update.
on:
  push:
    branches: [main]
    paths-ignore: ['web/**', 'scripts/build-web.mjs', 'scripts/web-content.mjs', '**/*.md']
  pull_request:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
env:
  VERSION: 1.1.${{ github.run_number }}
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      # what the app is made of besides src/ (scripts/deps-hash.mjs), worked out before the
      # version is written into package-lock.json
      - id: deps
        shell: bash
        run: echo "hash=$(node scripts/deps-hash.mjs)" >> "$GITHUB_OUTPUT"
      # the installers carry this build's version in their names and "About"
      - run: npm version ${{ env.VERSION }} --no-git-tag-version --allow-same-version
      - run: npm pkg set inkwellDeps=${{ steps.deps.outputs.hash }}
      # macOS: the native helpers (Vision OCR, read-along); Windows uses tesseract.js instead
      - if: matrix.os == 'macos-latest'
        run: npm run build:mac-tools
      # macOS: the app first, then the reminder helper and the widgets go inside it (as
      # install-mac.sh does); the zip is what installed apps update from (src/update.js)
      - if: matrix.os == 'macos-latest'
        run: |
          npx electron-builder --mac dir --publish never
          APP=$(ls -d dist/mac*/Inkwell.app | head -1)
          bash scripts/build-remind.sh "$APP"
          bash scripts/build-widget.sh "$APP"
          ditto -c -k --keepParent "$APP" "dist/Inkwell-${{ env.VERSION }}-mac.zip"
          # the small update: src/ and package.json alone, for apps built on the same parts
          (cd "$APP/Contents/Resources/app" && zip -qr -X "$GITHUB_WORKSPACE/dist/Inkwell-${{ env.VERSION }}-mac-app-${{ steps.deps.outputs.hash }}.zip" src package.json)
          npx electron-builder --mac dmg --prepackaged "$APP" --publish never
      - if: matrix.os == 'windows-latest'
        run: npx electron-builder --win --publish never
      - if: matrix.os == 'windows-latest'
        shell: pwsh
        run: Compress-Archive -Path dist/win-unpacked/resources/app/src, dist/win-unpacked/resources/app/package.json -DestinationPath "dist/Inkwell-${{ env.VERSION }}-win-app-${{ steps.deps.outputs.hash }}.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: inkwell-${{ matrix.os }}
          path: |
            dist/*.dmg
            dist/*-mac.zip
            dist/*-app-*.zip
            dist/*.exe

  release:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: Inkwell ${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          body: |
            ${{ github.event.head_commit.message }}

            **macOS:** `Inkwell-${{ env.VERSION }}-arm64.dmg` · **Windows:** `Inkwell-Setup-${{ env.VERSION }}.exe`
            Not code-signed: on Windows choose *More info → Run anyway*; on macOS right-click → *Open*.
            Installed apps update themselves from here (`-mac.zip` on macOS, the installer on Windows).
          files: out/*
